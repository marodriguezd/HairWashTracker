name: hair_wash_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floors imposed by file_picker 13 / share_plus 13; a lower claim would
  # advertise an SDK range that cannot resolve these dependencies.
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  # 2.5.0 moved this plugin to Pigeon's JNI interop, whose runtime lookups
  # break once R8 renames the Kotlin coroutine types it resolves by name: every
  # read and write fails in release builds. Keep the method-channel version
  # until the upstream R8 rules ship.
  shared_preferences_android: '>=2.4.28 <2.5.0'
  intl: ^0.20.0
  table_calendar: ^3.1.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#E0F7FA"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/