name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  APP_ID: io.github.marodriguezd.hairwashtracker

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: HairWashTracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::pubspec version $version does not match tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Name release APK
        id: apk
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)
          name="HairWashTracker-${version}.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "build/app/outputs/flutter-apk/${{ steps.apk.outputs.name }}" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Release APK is debug-signed; updates would not be installable."
            exit 1
          fi

      - name: Write checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum "${{ steps.apk.outputs.name }}" > "${{ steps.apk.outputs.name }}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            HairWashTracker/build/app/outputs/flutter-apk/${{ steps.apk.outputs.name }}
            HairWashTracker/build/app/outputs/flutter-apk/${{ steps.apk.outputs.name }}.sha256
          retention-days: 90

  # Release-only failures (R8 renaming, missing plugin registration) pass every
  # unit test and only show up when the APK actually runs, so nothing is
  # published before the built artifact has started on a device image.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: release

      - name: Start the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The action runs this line through /bin/sh, so the checks live in a
          # bash script where variables and options persist.
          script: bash .github/scripts/release-smoke.sh "$(ls release/*.apk)"

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: smoke.png
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: release

      - name: Verify checksum file
        run: cd release && sha256sum -c ./*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.apk
            release/*.sha256
          name: Hair Wash Tracker ${{ github.ref_name }}
          body: |
            First stable release of Hair Wash Tracker, a local-first app for
            logging and planning hair washes. All data stays on the device: no
            account, no cloud, no network calls.

            Highlights:

            - Calendar logging: tap a day to add or remove a wash; one entry per
              day, persisted immediately.
            - Adaptive prediction: an EWMA model with trend and weekday affinity
              estimates the next wash and marks predicted dates on the calendar.
            - Statistics: week and month counts, average and median intervals,
              cadence, trend and confidence.
            - Data portability: CSV export and import with ISO dates
              (yyyy-MM-dd) plus JSON backups, shared through the system sheet.
            - Material 3 interface: tonal surfaces, four seed accents, system
              dynamic color on Android 12+, light/dark/auto themes, and adaptive
              navigation for phones and large screens.
            - Six UI languages: English, Spanish, German, French, Italian and
              Simplified Chinese, including Material widgets and calendar
              dates.
            - Android 16 (API 36) target, edge-to-edge rendering and predictive
              back.

            This release also fixes missing Material localization delegates and
            dates that previously remained in English.

            The APK is signed with the project release key; a SHA-256 checksum
            is attached. Requires Android 7.0 (API 24) or newer.
