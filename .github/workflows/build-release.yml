name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: HairWashTracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Release APK is debug-signed; updates would not be installable."
            exit 1
          fi

      - name: Write checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            HairWashTracker/build/app/outputs/flutter-apk/app-release.apk
            HairWashTracker/app-release.apk.sha256
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            HairWashTracker/build/app/outputs/flutter-apk/app-release.apk
            HairWashTracker/app-release.apk.sha256
          name: Hair Wash Tracker ${{ github.ref_name }}
          body: |
            First stable release of Hair Wash Tracker, a local-first app for
            logging and planning hair washes. All data stays on the device: no
            account, no cloud, no network calls.

            Highlights:

            - Calendar logging: tap a day to add or remove a wash; one entry per
              day, persisted immediately.
            - Adaptive prediction: an EWMA model with trend and weekday affinity
              estimates the next wash and marks predicted dates on the calendar.
            - Statistics: week and month counts, average and median intervals,
              cadence, trend and confidence.
            - Data portability: CSV export and import with ISO dates
              (yyyy-MM-dd) plus JSON backups, shared through the system sheet.
            - Material 3 interface: tonal surfaces, four seed accents, system
              dynamic color on Android 12+, light/dark/auto themes, and adaptive
              navigation for phones and large screens.
            - Six UI languages: English, Spanish, German, French, Italian and
              Simplified Chinese, including Material widgets and calendar
              dates.
            - Android 16 (API 36) target, edge-to-edge rendering and predictive
              back.

            This release also fixes missing Material localization delegates and
            dates that previously remained in English.

            The APK is signed with the project release key; a SHA-256 checksum
            is attached. Requires Android 7.0 (API 24) or newer.
